<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hamburguesas El Gordo</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#111;--card:#1d1d1d;--tx:#f5f5f5;--mu:#aaa;--or:#ff6a13;--ye:#ffc928;--bd:#2c2c2c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Nunito,system-ui,sans-serif;padding-bottom:90px}
h1,h2{font-family:'Bowlby One',Impact,sans-serif;font-weight:400;margin:0}
header{text-align:center;padding:28px 16px 10px;position:relative;overflow:hidden}
.logo{font-size:2.3rem;background:linear-gradient(90deg,var(--or),var(--ye),var(--or));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
.sub{color:var(--mu);font-size:.85rem;margin-top:6px}
.bounce{display:inline-block;font-size:2.4rem;animation:bob 1.6s ease-in-out infinite}
@keyframes shine{to{background-position:200% 0}}
@keyframes bob{50%{transform:translateY(-10px) rotate(-8deg)}}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:rgba(17,17,17,.95);backdrop-filter:blur(8px)}
nav a{flex:none;padding:7px 14px;border-radius:99px;background:var(--card);color:var(--tx);text-decoration:none;font-weight:800;font-size:.85rem;border:1px solid var(--bd)}
section{padding:18px 14px 4px;scroll-margin-top:60px}
h2{font-size:1.4rem;color:var(--or);margin-bottom:12px}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px;opacity:0;transform:translateY(24px);transition:.5s}
.item.in{opacity:1;transform:none}
.item .t{flex:1}.item b{font-size:1rem}.item p{margin:3px 0 0;color:var(--mu);font-size:.78rem;line-height:1.3}
.pr{color:var(--ye);font-weight:800;margin-top:4px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl button{width:36px;height:36px;border-radius:50%;border:0;background:var(--or);color:#fff;font-size:1.3rem;font-weight:800}
.ctl button.m{background:#333}
.ctl span{min-width:16px;text-align:center;font-weight:800}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}
.promo{background:linear-gradient(135deg,var(--or),#c2410c);border:0}
.promo p,.promo .pr{color:#fff}
.fl{display:inline-block;animation:fl 1s ease-in-out infinite alternate}
@keyframes fl{to{transform:scale(1.25) translateY(-2px);filter:drop-shadow(0 0 4px #ff0)}}
.dips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.dip{text-align:center;padding:16px 8px;border-radius:18px;background:var(--card);border:1px solid var(--bd);font-weight:800;animation:float 3s ease-in-out infinite}
.dip:nth-child(2){animation-delay:.4s}.dip:nth-child(3){animation-delay:.8s}.dip:nth-child(4){animation-delay:1.2s}
.blob{width:54px;height:54px;border-radius:50% 45% 55% 50%;margin:0 auto 8px;animation:morph 4s ease-in-out infinite;box-shadow:0 0 18px var(--c)}
@keyframes morph{50%{border-radius:45% 55% 40% 60%;transform:rotate(15deg) scale(1.1)}}
@keyframes float{50%{transform:translateY(-6px)}}
.sal{display:flex;justify-content:space-between;background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-weight:800}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:8;display:none;justify-content:space-between;align-items:center;background:var(--or);color:#fff;border:0;border-radius:16px;padding:14px 18px;font:800 1rem Nunito,sans-serif;animation:pulse 1.6s infinite;box-shadow:0 6px 20px rgba(255,106,19,.45)}
@keyframes pulse{50%{transform:scale(1.03)}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10;display:none;align-items:flex-end}
.ov.on{display:flex}
.sheet{width:100%;max-height:92%;overflow:auto;background:#181818;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .35s}
@keyframes up{from{transform:translateY(100%)}}
.sheet h2{font-size:1.2rem}
input,textarea{width:100%;background:#262626;border:1px solid #3a3a3a;color:var(--tx);border-radius:10px;padding:10px;font:inherit;margin:6px 0}
.ln{background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
.ln b{display:flex;justify-content:space-between}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ch button{border:1px solid #444;background:#262626;color:var(--tx);border-radius:99px;padding:6px 12px;font:700 .8rem Nunito,sans-serif}
.ch button.on{background:var(--ye);color:#111;border-color:var(--ye)}
.tot{display:flex;justify-content:space-between;font-size:1.3rem;font-weight:800;margin:14px 0}
.send{width:100%;background:#25d366;color:#fff;border:0;border-radius:14px;padding:15px;font:800 1.05rem Nunito,sans-serif}
.x{float:right;background:none;border:0;color:var(--mu);font-size:1.6rem}
footer{text-align:center;color:var(--mu);font-size:.78rem;padding:20px}
</style></head><body>
<header><span class="bounce">🍔</span><div class="logo h1" style="font-family:'Bowlby One',Impact,sans-serif">HAMBURGUESAS EL GORDO</div><div class="sub">Abierto Jue–Dom · 6:00 PM – 11:00 PM · Servicio para llevar</div></header>
<nav><a href="#promos">Promos</a><a href="#burgers">Hamburguesas</a><a href="#aderezos">Aderezos</a><a href="#papas">Papas</a><a href="#boneless">Boneless</a><a href="#bebidas">Bebidas</a></nav>
<div id="app"></div>
<footer>📍 Río Támesis 2228, Fracc. Bernardo Reyes</footer>
<button class="bar" id="bar"><span id="bc">0 productos</span><span>Ver pedido · <span id="bt">$0</span></span></button>
<div class="ov" id="ov"><div class="sheet" id="sh"></div></div>
<script>
var PHONE="528132594535";
var DIPS=[["Mango habanero","#ff9f1c"],["Ranch","#f1f1e6"],["Queso","#ffd23f"],["Buffalo","#ff4d0d"]];
var CATS=[["promos","🔥 Promociones"],["burgers","Hamburguesas"],["papas","Papas"],["boneless","Boneless"],["bebidas","Bebidas"]];
var M=[
["p1","promos","Promo 1: 3 Hamburguesas Especiales","Tres hamburguesas especiales",199,1],
["p2","promos","Promo 2: Especial + ½ papas","1 hamburguesa especial + ½ orden de papas",109,1],
["h1","burgers","Hamburguesa Especial","Carne de res 110 g, tomate, cebolla, lechuga, mayonesa, mostaza, jamón y queso",79,1],
["h2","burgers","Hamburguesa Tocino","Carne de res 110 g, tocino frito, tomate, cebolla, lechuga, mayonesa, mostaza, jamón y queso",99,1],
["h3","burgers","Hamburguesa Doble","Doble carne de res (220 g), tomate, cebolla, lechuga, mayonesa, mostaza, jamón y queso",99,1],
["h4","burgers","Hamburguesa de Pollo","Boneless, tomate, cebolla, lechuga, mayonesa, mostaza, jamón y queso",99,1],
["h5","burgers","Hamburguesa ¼ de kilo","Carne de res 250 g, tomate, cebolla, lechuga, mayonesa, mostaza, jamón y queso",99,1],
["h6","burgers","Salchiburguer","Carne de res 110 g con salchicha roja, tomate, cebolla, lechuga, mayonesa, mostaza, jamón y queso",99,1],
["h7","burgers","Monster","Carne de res 110 g con salchicha roja o tocino (a elección), tomate, cebolla, lechuga, mayonesa, mostaza, jamón y queso",119,1],
["h8","burgers","SUPER Monster 💪","Carne de res 220 g, tocino, salchicha roja, tomate, cebolla, lechuga, mayonesa, mostaza, jamón y queso. Solo para valientes",137,1],
["a1","papas","Papas fritas clásicas","",50,1],
["a2","papas","Papas preparadas","Con queso amarillo y tocino",70,1],
["a3","papas","Papas especiales","Con carne de hamburguesa, queso y jamón",70,1],
["a4","papas","Aros de cebolla","",80,1],
["b1","boneless","Boneless con papas","½ papas a la francesa + boneless + 1 salsa",120,1],
["b2","boneless","Boneless por kilo","1 kilo de boneless + 2 órdenes de papas + 1 aderezo",350,1],
["b3","boneless","Ensalada de boneless","Lechuga, tomate, aguacate, boneless, ranch y aderezo al gusto",120,1],
["d1","bebidas","Botella de agua","",30,0],["d2","bebidas","Coca Zero","",30,0],["d3","bebidas","Coca regular","",30,0],
["d4","bebidas","Manzana","",30,0],["d5","bebidas","Sprite","",30,0],["d6","bebidas","Mirinda","Preguntar existencia",30,0]
];
var SAL=[["Mango habanero",4],["Salsa Buffalo",3],["Salsa BBQ",2]];
var cart={},det={};
var $=function(i){return document.getElementById(i)};
function pr(n){return"$"+n}
function build(){
 var h="";
 CATS.forEach(function(c){
  h+='<section id="'+c[0]+'"><h2>'+c[1]+'</h2>';
  M.filter(function(m){return m[1]==c[0]}).forEach(function(m){
   h+='<div class="item'+(c[0]=="promos"?" promo":"")+'"><div class="t"><b>'+m[2]+'</b>'+(m[3]?'<p>'+m[3]+'</p>':'')+'<div class="pr">'+pr(m[4])+'</div></div><div class="ctl"><button class="m" onclick="chg(\''+m[0]+'\',-1)" aria-label="Quitar">−</button><span id="q_'+m[0]+'">0</span><button onclick="chg(\''+m[0]+'\',1)" aria-label="Agregar">+</button></div></div>';
  });
  if(c[0]=="burgers"){
   h+='</section><section id="aderezos"><h2>🥫 Aderezos y salsas</h2><div class="dips">';
   DIPS.forEach(function(d){h+='<div class="dip"><div class="blob" style="background:'+d[1]+';--c:'+d[1]+'"></div>'+d[0]+'</div>'});
   h+='</div>';
   SAL.forEach(function(s){var f="";for(var i=0;i<s[1];i++)f+='<span class="fl" style="animation-delay:'+i*.15+'s">🔥</span>';h+='<div class="sal"><span>'+s[0]+'</span><span>'+f+'</span></div>'});
   h+='<p style="color:var(--mu);font-size:.8rem">Elige tu aderezo al armar el pedido.</p>';
  }
  h+='</section>';
 });
 $("app").innerHTML=h;
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.1});
 document.querySelectorAll(".item").forEach(function(el,i){el.style.transitionDelay=(i%4)*70+"ms";io.observe(el)});
}
function item(id){return M.filter(function(m){return m[0]==id})[0]}
function chg(id,d){
 cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];
 var q=$("q_"+id);q.textContent=cart[id]||0;q.classList.remove("pop");void q.offsetWidth;q.classList.add("pop");
 upd();
}
function total(){var t=0;for(var k in cart)t+=item(k)[4]*cart[k];return t}
function upd(){
 var n=0;for(var k in cart)n+=cart[k];
 $("bar").style.display=n?"flex":"none";
 $("bc").textContent=n+(n==1?" producto":" productos");$("bt").textContent=pr(total());
}
function openSheet(){
 var h='<button class="x" onclick="closeSheet()">×</button><h2>Tu pedido</h2><input id="nm" placeholder="Tu nombre" value="'+(window._nm||"")+'">';
 for(var k in cart){
  var m=item(k);det[k]=det[k]||{d:[],n:""};
  h+='<div class="ln"><b><span>'+cart[k]+'× '+m[2]+'</span><span>'+pr(m[4]*cart[k])+'</span></b>';
  if(m[5]){
   h+='<div class="ch">';DIPS.forEach(function(d){h+='<button class="'+(det[k].d.indexOf(d[0])>-1?"on":"")+'" onclick="tg(\''+k+'\',\''+d[0]+'\')">'+d[0]+'</button>'});h+='</div>';
  }
  h+='<input data-k="'+k+'" placeholder="Detalles (sin cebolla, término, salsa…)" value="'+det[k].n+'" oninput="det[this.dataset.k].n=this.value"></div>';
 }
 h+='<div class="tot"><span>Total</span><span>'+pr(total())+'</span></div><input id="nt" placeholder="Notas generales (opcional)" value="'+(window._nt||"")+'"><button class="send" onclick="send()">Enviar pedido por WhatsApp</button>';
 $("sh").innerHTML=h;$("ov").classList.add("on");
}
function tg(k,d){
 window._nm=$("nm").value;window._nt=$("nt").value;
 var a=det[k].d,i=a.indexOf(d);i>-1?a.splice(i,1):a.push(d);openSheet();
}
function closeSheet(){$("ov").classList.remove("on")}
function send(){
 var nm=$("nm").value.trim();
 if(!nm){$("nm").focus();$("nm").placeholder="Escribe tu nombre para continuar";return}
 var t="🍔 *Pedido – Hamburguesas El Gordo*\n👤 Nombre: "+nm+"\n\n";
 for(var k in cart){
  var m=item(k),d=det[k];
  t+="• "+cart[k]+"× "+m[2]+" – "+pr(m[4]*cart[k])+"\n";
  if(d.d.length)t+="   Aderezo: "+d.d.join(", ")+"\n";
  if(d.n)t+="   Detalles: "+d.n+"\n";
 }
 var nt=$("nt").value.trim();if(nt)t+="\n📝 "+nt+"\n";
 t+="\n💰 *Total: "+pr(total())+"*";
 window.open("https://wa.me/"+PHONE+"?text="+encodeURIComponent(t),"_blank");
}
$("bar").onclick=openSheet;
$("ov").onclick=function(e){if(e.target==this)closeSheet()};
build();
</script></body></html>

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Menú Mailo's Smash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: poster-style menu. Header with logo, filter chips, card grid with photo + price tab, bottom order bar that opens a sheet. */
:root {
  --bg: #121110;
  --surface: #1c1a17;
  --surface-2: #272420;
  --fg: #f6f1e4;
  --muted: #a8a08e;
  --accent: #ffc400;
  --accent-ink: #151209;
  --line: #3a352c;
  --danger: #ff7a6b;
  --font-display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-label: "Barlow Condensed", "Arial Narrow", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
}
.wrap { max-width: 1080px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Header */
.top { display: flex; align-items: center; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.logo { width: 84px; height: 84px; border-radius: 50%; flex: none; display: block; }
.top h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 8vw, 48px); line-height: 1; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
.top h1 span { color: var(--accent); }
.top p { margin: 6px 0 0; color: var(--muted); font-family: var(--font-label); font-weight: 600; font-size: 17px; letter-spacing: .12em; text-transform: uppercase; }

/* Filters */
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 18px; }
.chip { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 18px; font-family: var(--font-label); font-weight: 700; font-size: 17px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Cards */
.grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 980px) { .grid { grid-template-columns: repeat(3, 1fr); } }
.card { background: var(--surface); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card[hidden] { display: none; }
.photo { position: relative; aspect-ratio: 4 / 3; background: #0c0b0a; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.price { position: absolute; left: 0; bottom: 14px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: 30px; line-height: 1; padding: 8px 18px 8px 14px; clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); font-variant-numeric: tabular-nums; }
.body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.body h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; color: var(--accent); text-wrap: balance; }
.desc { margin: 0; color: var(--fg); opacity: .86; flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-family: var(--font-label); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 2px 8px; }
.actions { margin-top: 4px; min-height: 48px; display: flex; }
.add { flex: 1; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px; font-family: var(--font-label); font-weight: 700; font-size: 19px; letter-spacing: .1em; text-transform: uppercase; min-height: 48px; }
.add:active { transform: translateY(1px); }

/* Stepper */
.stepper { display: flex; align-items: center; justify-content: space-between; flex: 1; border: 1.5px solid var(--accent); border-radius: 4px; min-height: 48px; }
.stepper button { width: 52px; align-self: stretch; background: transparent; border: 0; font-size: 26px; line-height: 1; color: var(--accent); }
.stepper output { font-family: var(--font-display); font-size: 24px; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }

/* Order bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); background: linear-gradient(to top, var(--bg) 60%, transparent); }
.bar[hidden] { display: none; }
.bar button { display: flex; width: 100%; max-width: 1080px; margin: 0 auto; align-items: center; justify-content: space-between; gap: 12px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 14px 18px; font-family: var(--font-label); font-weight: 700; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
.bar .count { background: var(--accent-ink); color: var(--accent); border-radius: 999px; min-width: 28px; height: 28px; display: inline-grid; place-items: center; padding: 0 8px; font-size: 17px; margin-right: 10px; font-variant-numeric: tabular-nums; }
.bar .tot { font-family: var(--font-display); font-size: 24px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); }
.sheet { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 14px 14px 0 0; padding: 20px max(18px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px)); }
.sheet-in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.sheet[hidden], .scrim[hidden] { display: none; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; text-transform: uppercase; color: var(--accent); }
.close { background: var(--surface-2); border: 0; border-radius: 50%; width: 40px; height: 40px; font-size: 22px; line-height: 1; }
.lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.line { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding-block: 12px; border-bottom: 1px solid var(--line); }
.line b { font-family: var(--font-label); font-size: 21px; letter-spacing: .04em; text-transform: uppercase; font-weight: 700; min-width: 0; }
.line .sub { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.line .stepper { grid-column: 1 / -1; max-width: 160px; min-height: 40px; }
.line .stepper button { width: 44px; }
.total { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-label); font-weight: 700; font-size: 20px; letter-spacing: .1em; text-transform: uppercase; }
.total strong { font-family: var(--font-display); font-weight: 400; font-size: 36px; color: var(--accent); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
label { display: block; font-family: var(--font-label); font-weight: 700; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
input[type="text"], textarea { width: 100%; background: var(--bg); color: var(--fg); border: 1.5px solid var(--line); border-radius: 4px; padding: 12px; font: inherit; }
textarea { resize: vertical; min-height: 72px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { flex: 1 1 160px; min-height: 50px; border-radius: 4px; border: 0; font-family: var(--font-label); font-weight: 700; font-size: 19px; letter-spacing: .1em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer; }
.btn.wa { flex-basis: 100%; background: #25d366; color: #06210f; font-size: 21px; }
.btn.wa[aria-disabled="true"] { opacity: .4; pointer-events: none; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--fg); }
.hint { margin: 0; color: var(--muted); font-size: 14px; }
.empty { color: var(--muted); text-align: center; padding-block: 24px; }
.foot { margin-top: 36px; text-align: center; color: var(--muted); font-family: var(--font-label); letter-spacing: .12em; text-transform: uppercase; font-size: 15px; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
}
</style>

const $ = (s) => document.querySelector(s);
const money = (n) => "$" + n.toLocaleString("es-MX");
let cart = {};
try { cart = JSON.parse(localStorage.getItem("mailos-cart") || "{}") || {}; } catch (e) { cart = {}; }
const byId = Object.fromEntries(MENU.map((m) => [m.id, m]));
Object.keys(cart).forEach((k) => { if (!byId[k] || !(cart[k] > 0)) delete cart[k]; });

function save() { try { localStorage.setItem("mailos-cart", JSON.stringify(cart)); } catch (e) {} }
function setQty(id, q) {
  if (q <= 0) delete cart[id]; else cart[id] = Math.min(q, 20);
  save(); render();
}
function totals() {
  let n = 0, t = 0;
  for (const id in cart) { n += cart[id]; t += cart[id] * byId[id].price; }
  return { n, t };
}
function stepperHTML(id) {
  return '<div class="stepper"><button type="button" data-dec="' + id + '" aria-label="Quitar uno">−</button>' +
    '<output aria-live="polite">' + cart[id] + '</output>' +
    '<button type="button" data-inc="' + id + '" aria-label="Agregar uno">+</button></div>';
}

function buildCards() {
  $("#grid").innerHTML = MENU.map((m) =>
    '<article class="card" data-cat="' + m.cat + '" data-id="' + m.id + '">' +
      '<div class="photo"><img src="' + m.img + '" alt="' + m.name + '" loading="lazy">' +
      '<div class="price">' + money(m.price) + '</div></div>' +
      '<div class="body"><h2>' + m.name + '</h2>' +
      '<p class="desc">' + m.desc + '</p>' +
      '<div class="tags">' + m.tags.map((t) => '<span class="tag">' + t + '</span>').join("") + '</div>' +
      '<div class="actions"></div></div></article>'
  ).join("");
}

function render() {
  document.querySelectorAll(".card").forEach((card) => {
    const id = card.dataset.id;
    card.querySelector(".actions").innerHTML = cart[id]
      ? stepperHTML(id)
      : '<button class="add" type="button" data-inc="' + id + '">Agregar</button>';
  });
  const { n, t } = totals();
  $("#bar").hidden = n === 0 || !$("#sheet").hidden;
  $("#barCount").textContent = n;
  $("#barTotal").textContent = money(t);
  $("#sheetTotal").textContent = money(t);
  updateWa();
  const ids = Object.keys(cart);
  $("#lines").innerHTML = ids.length
    ? ids.map((id) => '<li class="line"><b>' + byId[id].name + '</b><span class="sub">' + money(cart[id] * byId[id].price) + '</span>' + stepperHTML(id) + '</li>').join("")
    : '<li class="empty">Tu pedido está vacío. Agrega una hamburguesa del menú.</li>';
}

function orderText() {
  const lines = Object.keys(cart).map((id) => cart[id] + " x " + byId[id].name + " - " + money(cart[id] * byId[id].price));
  const name = $("#cname").value.trim(), notes = $("#cnotes").value.trim();
  return ["Pedido Mailo's Smash Burgers", ...lines, "Total: " + money(totals().t),
    name ? "Nombre: " + name : "", notes ? "Notas: " + notes : ""].filter(Boolean).join("\n");
}

const WA_NUMBER = "526532611800";
function updateWa() {
  const a = $("#wa"), has = totals().n > 0;
  a.setAttribute("aria-disabled", has ? "false" : "true");
  a.href = has ? "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(orderText()) : "#";
}
function openCart() { $("#sheet").hidden = false; $("#scrim").hidden = false; $("#bar").hidden = true; $("#closeCart").focus(); }
function closeCart() { $("#sheet").hidden = true; $("#scrim").hidden = true; $("#fallback").hidden = true; render(); $("#openCart").focus?.(); }

document.addEventListener("click", (e) => {
  const inc = e.target.closest("[data-inc]"), dec = e.target.closest("[data-dec]");
  if (inc) return setQty(inc.dataset.inc, (cart[inc.dataset.inc] || 0) + 1);
  if (dec) return setQty(dec.dataset.dec, (cart[dec.dataset.dec] || 0) - 1);
  const chip = e.target.closest(".chip");
  if (chip) {
    document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", c === chip ? "true" : "false"));
    const f = chip.dataset.f;
    document.querySelectorAll(".card").forEach((c) => { c.hidden = !(f === "all" || c.dataset.cat === f); });
  }
});
$("#openCart").addEventListener("click", openCart);
$("#closeCart").addEventListener("click", closeCart);
$("#scrim").addEventListener("click", closeCart);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#sheet").hidden) closeCart(); });
$("#clear").addEventListener("click", () => { cart = {}; save(); closeCart(); });
$("#copy").addEventListener("click", async () => {
  if (!totals().n) return;
  const txt = orderText(), btn = $("#copy");
  try {
    await navigator.clipboard.writeText(txt);
    btn.textContent = "¡Copiado!";
    setTimeout(() => { btn.textContent = "Copiar pedido"; }, 1800);
  } catch (err) {
    $("#fallback").hidden = false;
    const ta = $("#orderText"); ta.value = txt; ta.focus(); ta.select();
  }
});

$("#cname").addEventListener("input", updateWa);
$("#cnotes").addEventListener("input", updateWa);
buildCards();
render();
</script>

</body></html>
